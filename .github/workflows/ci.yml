name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # 这里故意不装 requirements.txt，也不在测试里 import monitor.py：
        # monitor.py 在模块顶层调用 install_deps()，会尝试 pip 安装 pywin32
        # （Windows 专用），在 Linux 上永远装不上。测试只覆盖配置文件，
        # monitor.py 的语法由下面的 compileall 步骤检查。
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Syntax check
        run: python -m compileall -q monitor.py

      - name: Run tests
        run: python -m pytest
